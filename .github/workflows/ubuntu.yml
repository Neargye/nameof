name: ubuntu

on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'doc/**']
  pull_request:
    paths-ignore: ['**.md', 'doc/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ubuntu:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compiler:
        - { cc: "gcc-9",    cxx: "g++-9",      os: "ubuntu-22.04", strict: "c++17" }
        - { cc: "gcc-10",   cxx: "g++-10",     os: "ubuntu-22.04" }
        - { cc: "gcc-11",   cxx: "g++-11",     os: "ubuntu-22.04" }
        - { cc: "gcc-12",   cxx: "g++-12",     os: "ubuntu-22.04" }
        - { cc: "gcc-13",   cxx: "g++-13",     os: "ubuntu-24.04" }
        - { cc: "gcc-14",   cxx: "g++-14",     os: "ubuntu-24.04" }
        - { cc: "gcc-15",   cxx: "g++-15",     os: "ubuntu-24.04" }
        - { cc: "gcc-16",   cxx: "g++-16",     os: "ubuntu-26.04", sanitize: true, strict: "c++17 c++20 c++23" }
        - { cc: "clang-13", cxx: "clang++-13", os: "ubuntu-22.04" }
        - { cc: "clang-14", cxx: "clang++-14", os: "ubuntu-22.04" }
        - { cc: "clang-15", cxx: "clang++-15", os: "ubuntu-22.04" }
        - { cc: "clang-16", cxx: "clang++-16", os: "ubuntu-22.04" }
        - { cc: "clang-17", cxx: "clang++-17", os: "ubuntu-24.04" }
        - { cc: "clang-18", cxx: "clang++-18", os: "ubuntu-24.04" }
        - { cc: "clang-19", cxx: "clang++-19", os: "ubuntu-24.04" }
        - { cc: "clang-20", cxx: "clang++-20", os: "ubuntu-24.04" }
        - { cc: "clang-21", cxx: "clang++-21", os: "ubuntu-24.04" }
        - { cc: "clang-22", cxx: "clang++-22", os: "ubuntu-24.04" }
        - { cc: "clang-23", cxx: "clang++-23", os: "ubuntu-24.04", sanitize: true, strict: "c++17 c++20 c++23" }

    name: "${{ matrix.compiler.cc }}"
    runs-on: ${{ matrix.compiler.os }}
    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
    steps:
    - uses: actions/checkout@v7

    - name: Configure clang
      if: ${{ startsWith(matrix.compiler.cc, 'clang') }}
      run: |
        if command -v "$CXX" > /dev/null 2>&1; then
          exit 0
        fi

        wget -qO - https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor | sudo tee /etc/apt/keyrings/llvm-archive-keyring.gpg > /dev/null

        clang_version="${{ matrix.compiler.cc }}"
        clang_version="${clang_version#clang-}"
        ubuntu_codename="$(lsb_release -cs)"

        echo "deb [signed-by=/etc/apt/keyrings/llvm-archive-keyring.gpg] https://apt.llvm.org/${ubuntu_codename}/ llvm-toolchain-${ubuntu_codename}-${clang_version} main" | sudo tee /etc/apt/sources.list.d/llvm.list
        sudo apt update
        sudo apt install -y ${{ matrix.compiler.cc }}

    - name: Configure gcc
      if: ${{ startsWith(matrix.compiler.cc, 'gcc') }}
      run: |
        if command -v "$CXX" > /dev/null 2>&1; then
          exit 0
        fi

        sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
        sudo apt update
        sudo apt install -y ${{ matrix.compiler.cxx }}

    - name: Compiler version
      run: '"$CXX" --version'

    - name: Strict warnings
      if: ${{ matrix.compiler.strict }}
      run: |
        # Users compile the header with their own flags, so keep it clean under strict warnings.
        # gcc-9 covers the GCC < 11 -Wconversion pragma in the header.
        flags=(-Wall -Wextra -pedantic-errors -Werror -Wconversion -Wsign-conversion -Wold-style-cast -Wundef -Wcast-qual -Wnon-virtual-dtor -Wnull-dereference -Wimplicit-fallthrough)
        case "$CXX" in
          g++*) flags+=(-Wshadow -Wuseless-cast -Wduplicated-branches -Wduplicated-cond -Wlogical-op) ;;
          *) flags+=(-Wshadow-all -Wextra-semi -Wcomma -Wunreachable-code) ;;
        esac
        for std in ${{ matrix.compiler.strict }}; do
          for src in example/example.cpp example/example_custom_name.cpp test/test_standalone.cpp test/test.cpp test/test_aliases.cpp; do
            echo "$CXX -std=$std $src"
            "$CXX" -std="$std" -fsyntax-only "${flags[@]}" -DDOCTEST_CONFIG_USE_STD_HEADERS -Iinclude -Itest/3rdparty "$src"
          done
        done

    - name: Configure Release
      run: cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release

    - name: Build Release
      run: cmake --build build-release --parallel "$(nproc)" --config Release

    - name: Test Release
      run: ctest --test-dir build-release --parallel "$(nproc)" --output-on-failure --no-tests=error -C Release

    - name: Configure Debug
      run: cmake -S . -B build-debug -DCMAKE_BUILD_TYPE=Debug

    - name: Build Debug
      run: cmake --build build-debug --parallel "$(nproc)" --config Debug

    - name: Test Debug
      run: ctest --test-dir build-debug --parallel "$(nproc)" --output-on-failure --no-tests=error -C Debug

    - name: Require standard reflection tests
      if: ${{ matrix.compiler.cc == 'gcc-16' }}
      run: |
        ctest --test-dir build-release --output-on-failure --no-tests=error -R "^test-reflection-semantics-cpp26$" -C Release
        ctest --test-dir build-debug --output-on-failure --no-tests=error -R "^test-reflection-semantics-cpp26$" -C Debug

    - name: Sanitizers (ASan + UBSan)
      if: ${{ matrix.compiler.sanitize }}
      env:
        CXXFLAGS: -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer
        LDFLAGS: -fsanitize=address,undefined
        ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
        UBSAN_OPTIONS: print_stacktrace=1
      run: |
        # Newer runner kernels use more ASLR entropy than older sanitizer runtimes support.
        sudo sysctl vm.mmap_rnd_bits=28
        cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug
        cmake --build build-sanitize --parallel "$(nproc)"
        ctest --test-dir build-sanitize --parallel "$(nproc)" --output-on-failure --no-tests=error

  fmt:
    timeout-minutes: 30
    name: fmt
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7

    - name: Install fmt
      run: |
        sudo apt update
        sudo apt install -y libfmt-dev

    - name: Configure
      run: |
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DNAMEOF_TEST_REQUIRE_FMT=ON

    - name: Build
      run: cmake --build build --parallel "$(nproc)" --target test-cpp17

    - name: Test
      run: ctest --test-dir build --parallel "$(nproc)" --output-on-failure --no-tests=error -R "^test-cpp17$"
