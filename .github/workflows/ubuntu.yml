name: ubuntu

on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'doc/**']
  pull_request:
    paths-ignore: ['**.md', 'doc/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: "${{ matrix.config.compiler }} / ${{ matrix.config.build_type }}"
    timeout-minutes: 30
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        # Users compile the header with their own flags, so strict rows keep it clean under strict warnings.
        # gcc-9 covers the static_cast enum scanning used before GCC 11.
        config:
        - { os: ubuntu-22.04, compiler: "gcc-9",    build_type: Release, strict: true }
        - { os: ubuntu-22.04, compiler: "gcc-9",    build_type: Debug }
        - { os: ubuntu-22.04, compiler: "gcc-10",   build_type: Release }
        - { os: ubuntu-22.04, compiler: "gcc-11",   build_type: Release }
        - { os: ubuntu-22.04, compiler: "gcc-12",   build_type: Release }
        - { os: ubuntu-24.04, compiler: "gcc-13",   build_type: Release }
        - { os: ubuntu-24.04, compiler: "gcc-14",   build_type: Release }
        - { os: ubuntu-26.04, compiler: "gcc-15",   build_type: Release }
        - { os: ubuntu-26.04, compiler: "gcc-16",   build_type: Release, strict: true }
        - { os: ubuntu-22.04, compiler: "clang-13", build_type: Release }
        - { os: ubuntu-22.04, compiler: "clang-13", build_type: Debug }
        - { os: ubuntu-22.04, compiler: "clang-14", build_type: Release }
        - { os: ubuntu-22.04, compiler: "clang-15", build_type: Release }
        - { os: ubuntu-22.04, compiler: "clang-16", build_type: Release }
        - { os: ubuntu-24.04, compiler: "clang-17", build_type: Release }
        - { os: ubuntu-24.04, compiler: "clang-18", build_type: Release }
        - { os: ubuntu-24.04, compiler: "clang-19", build_type: Release }
        - { os: ubuntu-24.04, compiler: "clang-20", build_type: Release }
        - { os: ubuntu-24.04, compiler: "clang-21", build_type: Release }
        - { os: ubuntu-24.04, compiler: "clang-22", build_type: Release }
        - { os: ubuntu-24.04, compiler: "clang-23", build_type: Release, strict: true }

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: ./.github/actions/setup-linux-compiler
      with:
        compiler: ${{ matrix.config.compiler }}

    - name: Configure
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }} \
          -DNAMEOF_TEST_STRICT_WARNINGS=${{ matrix.config.strict && 'ON' || 'OFF' }}

    - name: Build
      run: cmake --build build --parallel "$(nproc)"

    - name: Test
      run: ctest --test-dir build --parallel "$(nproc)" --output-on-failure --no-tests=error

    - name: Require standard reflection tests
      if: ${{ matrix.config.compiler == 'gcc-16' }}
      run: |
        # The tests already ran above. Only check that CMake registered them.
        ctest --test-dir build -N -R "^test-reflection-semantics-cpp26$" | grep "Total Tests: 1"

  sanitize:
    name: "${{ matrix.config.compiler }} / sanitizers"
    timeout-minutes: 30
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
        - { os: ubuntu-26.04, compiler: "gcc-16" }
        - { os: ubuntu-24.04, compiler: "clang-23" }

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: ./.github/actions/setup-linux-compiler
      with:
        compiler: ${{ matrix.config.compiler }}

    - name: Configure
      env:
        CXXFLAGS: -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer
        LDFLAGS: -fsanitize=address,undefined
      run: |
        # Newer runner kernels use more ASLR entropy than older sanitizer runtimes support.
        sudo sysctl vm.mmap_rnd_bits=28
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

    - name: Build
      run: cmake --build build --parallel "$(nproc)"

    - name: Test
      env:
        ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
        UBSAN_OPTIONS: print_stacktrace=1
      run: ctest --test-dir build --parallel "$(nproc)" --output-on-failure --no-tests=error

  fmt:
    name: "fmt (${{ matrix.os }})"
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-24.04 # fmt 9
        - ubuntu-26.04 # fmt 10

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install fmt
      run: |
        sudo apt-get update
        sudo apt-get install -y libfmt-dev

    - name: Configure
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNAMEOF_TEST_REQUIRE_FMT=ON

    - name: Build and test
      run: |
        cmake --build build --parallel "$(nproc)" --target test-cpp17 test_aliases-cpp17 test-fmt-order-cpp17
        ctest --test-dir build --parallel "$(nproc)" --output-on-failure --no-tests=error -R "^test(_aliases|-fmt-order)?-cpp17$"
