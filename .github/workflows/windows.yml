name: windows

on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'doc/**']
  pull_request:
    paths-ignore: ['**.md', 'doc/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    timeout-minutes: 30
    runs-on: ${{ matrix.config.os }}
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        config:
        - { os: windows-2022, vs: "Visual Studio 2022", toolset: "", platforms: [x64, Win32], build_types: [Release, Debug] }
        - { os: windows-2025, vs: "Visual Studio 2026", toolset: "", platforms: [x64, Win32], build_types: [Release, Debug] }
        - { os: windows-2022, vs: "MSVC v142", toolset: v142, platforms: [x64, Win32], build_types: [Release] }
        - { os: windows-2025, vs: "Clang-cl", toolset: ClangCL, platforms: [x64], build_types: [Release] }

    name: "${{ matrix.config.vs }}"
    steps:
    - uses: actions/checkout@v7

    - name: Build and test
      run: |
        # Run every configuration and report all failures at the end.
        $failed = @()
        foreach ($platform in -split "${{ join(matrix.config.platforms, ' ') }}") {
          Write-Output "::group::Configure $platform"
          cmake -S . -B "build-$platform" -A $platform -T "${{ matrix.config.toolset }}"
          $configured = $LASTEXITCODE -eq 0
          Write-Output "::endgroup::"
          if (-not $configured) {
            $failed += "$platform / configure"
            continue
          }

          foreach ($buildType in -split "${{ join(matrix.config.build_types, ' ') }}") {
            Write-Output "::group::$platform / $buildType"
            cmake --build "build-$platform" --parallel $env:NUMBER_OF_PROCESSORS --config $buildType
            if ($LASTEXITCODE -eq 0) {
              ctest --test-dir "build-$platform" --parallel $env:NUMBER_OF_PROCESSORS --output-on-failure --no-tests=error -C $buildType
            }
            if ($LASTEXITCODE -ne 0) {
              $failed += "$platform / $buildType"
            }
            Write-Output "::endgroup::"
          }
        }

        if ($failed) {
          Write-Output "::error::Failed: $($failed -join ', ')"
          exit 1
        }
