name: windows

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
        - { os: windows-2022, vs: "Visual Studio 2022" } # https://github.com/actions/runner-images/blob/main/images/windows/Windows2022-Readme.md#visual-studio-enterprise-2022
        - { os: windows-2025, vs: "Visual Studio 2026" } # https://github.com/actions/runner-images/blob/main/images/windows/Windows2025-VS2026-Readme.md#visual-studio-enterprise-2026
        platform: [x64, Win32]
        build_type: [Release, Debug]

    name: "${{ matrix.config.vs }} / ${{ matrix.platform }} / ${{ matrix.build_type }}"
    steps:
    - uses: actions/checkout@v7

    - name: Configure
      run: cmake -S . -B build -A ${{ matrix.platform }}

    - name: Build
      run: cmake --build build --parallel $env:NUMBER_OF_PROCESSORS --config ${{ matrix.build_type }}

    - name: Test
      run: ctest --test-dir build --parallel $env:NUMBER_OF_PROCESSORS --output-on-failure -C ${{ matrix.build_type }}

  clang-cl:
    name: "Clang-cl / x64 / Release"
    runs-on: windows-2025

    steps:
    - uses: actions/checkout@v7

    - name: Configure
      run: cmake -S . -B build -G "Visual Studio 18 2026" -A x64 -T ClangCL

    - name: Build
      run: cmake --build build --parallel $env:NUMBER_OF_PROCESSORS --config Release

    - name: Test
      run: ctest --test-dir build --parallel $env:NUMBER_OF_PROCESSORS --output-on-failure -C Release
