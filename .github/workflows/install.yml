name: install

on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'doc/**']
  pull_request:
    paths-ignore: ['**.md', 'doc/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    timeout-minutes: 30
    name: CMake package
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7

    - name: Install nameof
      run: |
        cmake -S . -B build-install \
          -DCMAKE_INSTALL_PREFIX=/usr \
          -DNAMEOF_OPT_BUILD_EXAMPLES=OFF \
          -DNAMEOF_OPT_BUILD_TESTS=OFF \
          -DNAMEOF_OPT_INSTALL=ON
        cmake --install build-install \
          --prefix "${{ github.workspace }}/install"

    - name: Test installed files and pkg-config package
      run: |
        test -f "${{ github.workspace }}/install/share/nameof/LICENSE"
        export PKG_CONFIG_PATH="${{ github.workspace }}/install/lib/pkgconfig"
        pkg-config --exists nameof
        include_dir="$(pkg-config --variable=includedir nameof)"
        test "$(realpath "${include_dir}")" = "${{ github.workspace }}/install/include"
        test -z "$(pkg-config --libs nameof)"
        c++ -std=c++17 $(pkg-config --cflags nameof) \
          test/cmake-consumer/main.cpp \
          -o pkg-config-consumer
        ./pkg-config-consumer

    - name: Test installed package
      run: |
        cmake -S test/cmake-consumer -B build-consumer \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install"
        cmake --build build-consumer --parallel "$(nproc)"
        ctest --test-dir build-consumer --parallel "$(nproc)" --output-on-failure --no-tests=error

    - name: Test CPack archive
      run: |
        cpack --config build-install/CPackConfig.cmake \
          -G TGZ \
          -B package
        archive="$(find package -maxdepth 1 -name 'nameof-*.tar.gz' -print -quit)"
        test -n "${archive}"
        tar -tzf "${archive}" > package-contents.txt
        grep -Eq '(^|/)include/nameof\.hpp$' package-contents.txt
        grep -Eq '(^|/)lib/cmake/nameof/nameofConfig\.cmake$' package-contents.txt
        grep -Eq '(^|/)lib/pkgconfig/nameof\.pc$' package-contents.txt
        grep -Eq '(^|/)share/nameof/LICENSE$' package-contents.txt

    - name: Test DESTDIR package
      run: |
        DESTDIR="${{ github.workspace }}/stage" \
          cmake --install build-install
        test -f "${{ github.workspace }}/stage/usr/include/nameof.hpp"
        test -f "${{ github.workspace }}/stage/usr/share/nameof/LICENSE"
        export PKG_CONFIG_PATH="${{ github.workspace }}/stage/usr/lib/pkgconfig"
        pkg-config --exists nameof
        include_dir="$(pkg-config --variable=includedir nameof)"
        test "$(realpath "${include_dir}")" = "${{ github.workspace }}/stage/usr/include"

    - name: Test absolute install directories
      run: |
        prefix="${{ github.workspace }}/install absolute"
        cmake -S . -B build-absolute \
          -DCMAKE_INSTALL_PREFIX="${prefix}" \
          -DCMAKE_INSTALL_INCLUDEDIR="${prefix}/custom include" \
          -DCMAKE_INSTALL_LIBDIR="${prefix}/custom-lib" \
          -DNAMEOF_OPT_BUILD_EXAMPLES=OFF \
          -DNAMEOF_OPT_BUILD_TESTS=OFF \
          -DNAMEOF_OPT_INSTALL=ON
        cmake --install build-absolute
        test -f "${prefix}/custom include/nameof.hpp"
        export PKG_CONFIG_PATH="${prefix}/custom-lib/pkgconfig"
        # pkg-config output is shell-escaped, so let the shell parse it like make does.
        eval "c++ -std=c++17 $(pkg-config --cflags nameof) test/cmake-consumer/main.cpp -o pkg-config-absolute-consumer"
        ./pkg-config-absolute-consumer
        cmake -S test/cmake-consumer -B build-absolute-consumer \
          -Dnameof_DIR="${prefix}/custom-lib/cmake/nameof"
        cmake --build build-absolute-consumer --parallel "$(nproc)"
        ctest --test-dir build-absolute-consumer --parallel "$(nproc)" --output-on-failure --no-tests=error
