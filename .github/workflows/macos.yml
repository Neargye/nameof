name: macos

on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'doc/**']
  pull_request:
    paths-ignore: ['**.md', 'doc/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: "${{ matrix.config.os }} / ${{ matrix.config.build_type }}"
    timeout-minutes: 30
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        # Apple Silicon images. Xcode versions:
        # https://github.com/actions/runner-images/blob/main/images/macos/macos-15-arm64-Readme.md#xcode
        # https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md#xcode
        config:
        - { os: macos-15, build_type: Release }
        - { os: macos-26, build_type: Release }
        - { os: macos-26, build_type: Debug }

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Configure
      run: |
        c++ --version
        xcodebuild -version
        cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }}

    - name: Build
      run: cmake --build build --parallel "$(sysctl -n hw.logicalcpu)"

    - name: Test
      run: ctest --test-dir build --parallel "$(sysctl -n hw.logicalcpu)" --output-on-failure --no-tests=error
