name: macos

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
        - macos-15 # https://github.com/actions/runner-images/blob/main/images/macos/macos-15-arm64-Readme.md#xcode (Apple Silicon)
        - macos-26 # https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md#xcode (Apple Silicon)
        build_type: [Release, Debug]

    name: "${{ matrix.os }} / ${{ matrix.build_type }}"
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7

    - name: Configure
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

    - name: Build
      run: cmake --build build --parallel "$(sysctl -n hw.logicalcpu)" --config ${{ matrix.build_type }}

    - name: Test
      run: ctest --test-dir build --parallel "$(sysctl -n hw.logicalcpu)" --output-on-failure -C ${{ matrix.build_type }}
