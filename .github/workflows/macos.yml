name: macos

on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'doc/**']
  pull_request:
    paths-ignore: ['**.md', 'doc/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
        - macos-15 # https://github.com/actions/runner-images/blob/main/images/macos/macos-15-arm64-Readme.md#xcode (Apple Silicon)
        - macos-26 # https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md#xcode (Apple Silicon)

    name: "${{ matrix.os }}"
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7

    - name: Configure Release
      run: cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release

    - name: Build Release
      run: cmake --build build-release --parallel "$(sysctl -n hw.logicalcpu)" --config Release

    - name: Test Release
      run: ctest --test-dir build-release --parallel "$(sysctl -n hw.logicalcpu)" --output-on-failure --no-tests=error -C Release

    - name: Configure Debug
      run: cmake -S . -B build-debug -DCMAKE_BUILD_TYPE=Debug

    - name: Build Debug
      run: cmake --build build-debug --parallel "$(sysctl -n hw.logicalcpu)" --config Debug

    - name: Test Debug
      run: ctest --test-dir build-debug --parallel "$(sysctl -n hw.logicalcpu)" --output-on-failure --no-tests=error -C Debug
